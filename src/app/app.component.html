<main class="main" [style.--tile-size]="adjustedPxSize + 'px'">
  <div id="landingPage" [ngClass]="titleDisplayed ? 'visible' : 'invisible'">
    <div id="cover"></div>
    <div id="title" [style.opacity]="titleDisplayed ? 100 : 0 + '%'">
      <h1 class="pxOutline twoPxOutline">Tileset Viewer</h1>
      <p class="pxOutline">Tap once to make this title page dissapear</p>
      <p class="pxOutline">Tap twice to generate a new image</p>
      <p class="pxOutline">Click and drag to move around</p>
    </div>
  </div>

  <div class="content">
    <div class="dragSurface" *ngIf="showingTiles" cdkDrag (cdkDragMoved)="onDragMoved($event)" (cdkDragEnded)="onDragEnded()"  [style.transform]="'translate3d('+gridAdjustX+'px , '+gridAdjustY+'px, 0px)'">
      <div class="tilesHolder">
        <tile-component *ngFor="let tile of tileGen; let i = index" [tileId]="i" [gridX]="tileWidth" [gridY]="tileHeight" [zoomLevel]="zoomLevel" [seedVal]="randomSeed" [tileModX]="tileAdjustX" [tileModY]="tileAdjustY"/>
      </div>
    </div>
  </div>
</main>
